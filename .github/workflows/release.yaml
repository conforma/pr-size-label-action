---
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "${VERSION}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must match format vX.Y.Z (e.g., v1.2.0)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "${VERSION}" \
            --generate-notes \
            --title "${VERSION}"

      - name: Fetch release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git fetch --tags
          if ! git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Expected tag '${VERSION}' to exist after release creation"
            exit 1
          fi

      - name: Update major version tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          MAJOR=$(echo "${VERSION}" | grep -oE '^v[0-9]+')
          git tag -f "${MAJOR}" "${VERSION}"
          git push origin "${MAJOR}" --force
